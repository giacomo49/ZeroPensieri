# Costruisce l'installer per Windows e lo pubblica tra le "Releases" di GitHub.
# Parte da solo quando si pubblica un tag di versione (es. v0.1.0);
# si può anche avviare a mano dalla scheda "Actions" per avere l'installer come artefatto.
name: Installer Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPensieri-Setup
          path: dist/ZeroPensieri-Setup-*.exe
          if-no-files-found: error
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ZeroPensieri-Setup-*.exe \
            --title "ZeroPensieri $GITHUB_REF_NAME" \
            --notes "Scarica **ZeroPensieri-Setup** qui sotto e aprilo per installare il programma."
